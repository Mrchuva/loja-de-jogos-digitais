<!DOCTYPE html>
<html lang="pt-br">
<head>

</head>
<body>
<header class="header">

            <a href="#" class="btn-cadastro">Cadastro</a>
        </nav>

    </header>

    <h1>Cria sua conta</h1>
    <form id="formcadastro">
        <input type="text" id="nome" name="nome" placeholder="nome">
        <input type="text" id="sobrenome" name="sobrenome" placeholder="sobrenome">
        <input type="text" id="email" name="email" placeholder="email">
        <input type="password" id="senha" name="senha" placeholder="senha" required>
        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="confirmar senha" required>
        <button id="botao_criar_conta" type="submit">Criar conta</button>
    </form>
   
</body>
<script>
    const formcadastro = document.getElementById("formcadastro");
    formcadastro.addEventListener("submit", function(event){
        const senha = document.getElementById("senha").value;
        const confirma_senha = document.getElementById("confirmar_senha").value;
        if(senha !== confirma_senha){
            event.preventDefault();
            alert("As senhas nao conferem, tente novamente.");
            return;
}
            window.location("teste")
            event.preventDeafault();
        
    });
</script>
</html>
